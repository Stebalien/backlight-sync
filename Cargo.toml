[package]
name = "backlight-sync"
version = "1.0.0"
edition = "2021"
publish = false
license = "GPL-3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
ddc = "0.2.2"
ddc-i2c = { version = "0.2.2", features = ["with-linux"] }
env_logger = "0.11.7"
futures = "0.3.31"
log = "0.4.27"
mccs-caps = "0.1.3"
mccs-db = { version = "0.1.3", default-features = false }
tokio = { version = "1.44.1", default-features = false, features = ["rt", "macros", "process", "time", "rt-multi-thread"] }
tokio-udev = "0.9.1"
